name: ripasso-ci

on:
  push:
    branches: [main]
    paths:
      - "ripasso/app/**"

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calcola il tag
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ripasso/app
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ripasso-app:${{ env.TAG }}
      - name: Aggiorna il tag in Kustomize
        run: |
            sed -i "s|newTag: .*|newTag: \"${TAG}\"|" ripasso/base/kustomization.yaml
      - name: Commit del bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ripasso/base/kustomization.yaml
          git commit -m "ci: aggiorna immagine a ${TAG}"
          git push