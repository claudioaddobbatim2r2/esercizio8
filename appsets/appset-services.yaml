apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appset-services
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/claudioaddobbatim2r2/esercizio8.git
        revision: main
        directories:
          - path: appset-services/*
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/claudioaddobbatim2r2/esercizio8.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true