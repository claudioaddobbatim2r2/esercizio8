apiVersion: apps/v1
kind: Deployment
metadata:
  name: ripasso-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ripasso-app
  template:
    metadata:
      labels:
        app: ripasso-app
    spec:
      containers:
        - name: app
          image: claudioadd/ripasso-app:tag-inesistente
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: ripasso-config
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ripasso-app
spec:
  selector:
    app: ripasso-app
  ports:
    - port: 80
      targetPort: 5000