services:
  app:
    build: ./app
    ports:
      - "5000:5000"
    environment:
      APP_VERSION: "1"
      REDIS_HOST: redis
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  redis-data: