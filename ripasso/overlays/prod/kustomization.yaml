apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ripasso-prod
resources:
  - ../../base
  - sealed-secret.yaml
patches:
  - target:
      kind: Rollout
      name: ripasso-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
configMapGenerator:
  - name: ripasso-config
    behavior: merge
    literals:
      - APP_VERSION=prod-2
      