apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ripasso-dev
resources:
  - ../../base
  - sealed-secret.yaml
replicas:
  - name: ripasso-app
    count: 1
configMapGenerator:
  - name: ripasso-config
    behavior: merge
    literals:
      - APP_VERSION=dev-1
images:
  - name: claudioadd/ripasso-app
    newTag: "9999999"