apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ripasso-dev
resources:
  - ../../base
  - sealed-secret.yaml
patches:
  - target:
      kind: Rollout
      name: ripasso-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
configMapGenerator:
  - name: ripasso-config
    behavior: merge
    literals:
      - APP_VERSION=dev-3
images:
  - name: claudioadd/ripasso-app
    newTag: "0972bfa"