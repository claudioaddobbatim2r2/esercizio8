apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ripasso-app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  strategy:
   canary:
     canaryService: ripasso-app-canary
     steps:
       - setWeight: 50
       - analysis:
            templates:
              - templateName: ripasso-check
  selector:
    matchLabels:
      app: ripasso-app
  template:
    metadata:
      labels:
        app: ripasso-app
    spec:
      containers:
        - name: app
          image: claudioadd/ripasso-app:1
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: ripasso-config
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: ripasso-secret
                  key: API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ripasso-app
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: ripasso-app
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: ripasso-app-canary
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: ripasso-app
  ports:
    - port: 80
      targetPort: 5000