apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: ripasso-check
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  metrics:
    - name: contatore-visite
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: check
                    image: curlimages/curl:8.10.1
                    command: ["sh", "-c", "curl -fsS http://ripasso-app-canary/ | grep -q 'visite: [0-9]'"]