apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ripasso
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/claudioaddobbatim2r2/esercizio8.git
        revision: main
        directories:
          - path: ripasso/overlays/*
  template:
    metadata:
      name: 'ripasso-{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/claudioaddobbatim2r2/esercizio8.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'ripasso-{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true